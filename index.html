<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="darkreader-lock">
</head>
<body>
<title>spider-ball</title>
<style>
  :root{
    --bg:#f2f2f0;
    --ink:#16161a;
    --dim:#5c5c58;
    --veil:rgba(242,242,240,.82);
  }

  html{font-size:clamp(12px,1.15vw,20px)}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
  [hidden]{display:none!important}
  body{font:1rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  #hud{
    position:fixed;left:0;top:0;
    padding:calc(env(safe-area-inset-top,0px) + 0.85em) 1.3em 0;
    white-space:pre;font-variant-numeric:tabular-nums;color:var(--ink);
    pointer-events:none;z-index:2;
  }
  #keys{
    position:fixed;left:0;right:0;bottom:0;
    padding:0 1.3em calc(env(safe-area-inset-bottom,0px) + 0.85em);
    color:var(--dim);pointer-events:none;z-index:2;
  }
  #ach{
    position:fixed;inset:0;display:grid;place-items:center;
    padding:2em 1.3em;text-align:center;
    background:var(--veil);color:var(--ink);
    pointer-events:none;z-index:3;
  }
  #ach b{display:block;font-weight:400;letter-spacing:.06em}
  #ach small{display:block;margin-top:0.85em;color:var(--dim)}
  #title{
    position:fixed;left:0;right:0;top:0;
    padding:calc(env(safe-area-inset-top,0px) + 7em) 1.3em 0;
    text-align:center;pointer-events:none;z-index:2;
    opacity:1;transition:opacity 1.2s cubic-bezier(.4,0,.2,1);
  }
  #title.gone{opacity:0}
  #title b{
    display:block;font-weight:400;
    font-size:3.2rem;line-height:1.1;letter-spacing:.14em;color:var(--ink);
  }
  #title small{
    display:block;margin-top:1.2rem;font-size:1.15rem;letter-spacing:.06em;color:var(--dim);
  }
  #hud .stat{
    pointer-events:auto;cursor:pointer;
    border-bottom:1px solid transparent;
  }
  #hud .stat:hover{border-bottom-color:var(--dim)}
  #hud .stat.pinned{border-bottom-color:var(--ink)}
  #big{
    position:fixed;right:0;bottom:0;
    padding:0 1.4em calc(env(safe-area-inset-bottom,0px) + 3.4em);
    text-align:right;pointer-events:none;z-index:2;
  }
  #big .k{
    display:block;font-size:1rem;letter-spacing:.16em;color:var(--dim);
  }
  #big .v{
    display:block;margin-top:0.3rem;
    font-size:3.2rem;line-height:1;letter-spacing:.04em;
    color:var(--ink);font-variant-numeric:tabular-nums;
  }
  @media (prefers-reduced-motion:reduce){ #title{transition:none} }
</style>

<canvas id="game"></canvas>
<div id="title"><b>spider-ball</b><small id="tip">press space to jump</small></div>
<div id="big" hidden><span class="k" id="bigK"></span><span class="v" id="bigV"></span></div>
<div id="hud">dist 0m</div>
<div id="ach" hidden><b>achievement unlocked: backrooms</b><small>R to restart</small></div>
<div id="keys">MOVE: a/d, JUMP: space, ROPE: mouse1, REEL-ROPE: w/s, RESTART: r</div>

<script>
(function () {
  "use strict";

  var cv = document.getElementById("game");
  var ctx = cv.getContext("2d");
  var elHud = document.getElementById("hud");
  var elAch = document.getElementById("ach");
  var elTitle = document.getElementById("title");
  var elTip = document.getElementById("tip");
  var elBig = document.getElementById("big");
  var elBigK = document.getElementById("bigK");
  var elBigV = document.getElementById("bigV");
  var frozen = false;
  var started = false;
  var INTRO_ZOOM = 1.5;
  var INTRO_TIME = 1.6;
  var introP = 1;
  var IDLE_BACK = 2;
  var idleT = 0;

  var TIPS = [
    "press space to jump",
    "tip: use your mouse to grapple buildings!",
    "tip: double jump to phase through the ground",
    "tip: hold space to brace and land, even with the jump spent.",
    "tip: a snapped rope swings loose, then drops — go and pick it up.",
    "tip: double jump to reach higher places"
  ];
  var tipIndex = 0;

  function nextTip() {
    tipIndex = tipIndex + 1 >= TIPS.length ? 1 : tipIndex + 1;
    elTip.textContent = TIPS[tipIndex];
  }

  function beginPlay() {
    idleT = 0;
    if (started) return;
    started = true;
    elTitle.classList.add("gone");
  }

  function returnToIntro() {
    started = false;
    idleT = 0;
    nextTip();
    elTitle.classList.remove("gone");
  }
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  var GROUND_Y = 620;

  var LEVEL_GAP = 2400;
  var GRAV = 1500;
  var MAX_ROPE = 660, MIN_ROPE = 55;
  var SHORT_ROPE = 100;
  var PPM = 12;
  var RADIUS = 9;
  var JUMP = 700;
  var MIN_H = 300, MAX_H = 950;

  var RUN_MAX = 700, RUN_ACCEL_MAX = 2600, RUN_ACCEL_MIN = 800;

  var PHASE_SPEED = 2000;

  var BACKROOMS_DROP = 3;
  var BACKROOMS_WINDOW = 2;
  var runT = 0;
  var depthHist = [];

  var DOOR_AT = 67;
  var DOOR_HOLD = 1;
  var doorT = 0, darkSide = false, doorLock = false;

  var THEMES = {
    light: { bg: "#f2f2f0", fill: "#c9c9c6", edge: "#8f8f8b", ink: "#16161a",
             rope: "#d0392b", dot: "#1f5fd0", dotEdge: "#16161a",
             dim: "#5c5c58", veil: "rgba(242,242,240,.82)" },
    dark:  { bg: "#121218", fill: "#26262f", edge: "#4e4e60", ink: "#eceaf4",
             rope: "#ff7a63", dot: "#5aa9ff", dotEdge: "#0a0a10",
             dim: "#8b8b9c", veil: "rgba(18,18,24,.82)" }
  };
  var theme = THEMES.light;
  var themeAuto = true;

  function darkReaderActive() {
    try {
      var de = document.documentElement;
      if (de.getAttribute("data-darkreader-scheme")) return true;
      if (de.getAttribute("data-darkreader-mode")) return true;
      if (document.querySelector('style.darkreader,style[class*="darkreader"]')) return true;
    } catch (e) {}
    return false;
  }
  function prefersDark() {
    try {
      return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    } catch (e) { return false; }
  }
  function detectDark() {
    if (!themeAuto) return;
    var d = darkReaderActive() || prefersDark();
    if (d !== darkSide) { darkSide = d; setTheme(darkSide); }
  }

  function setTheme(dark) {
    theme = dark ? THEMES.dark : THEMES.light;
    var r = document.documentElement.style;
    r.setProperty("--bg", theme.bg);
    r.setProperty("--ink", theme.ink);
    r.setProperty("--dim", theme.dim);
    r.setProperty("--veil", theme.veil);
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var levels = [];

  var INTRO_END = 2200;

  function makeLevel(baseY, seed, intro) {
    var L = { baseY: baseY, items: [], cursor: -1200, rnd: mulberry32(seed),
              intro: !!intro, prevH: null, count: 0 };
    growLevel(L, 3200);
    return L;
  }

  function growLevel(L, toX) {
    while (L.cursor < toX) {
      var r = L.rnd;

      var easy = L.intro && L.cursor < INTRO_END;
      var w, h, gap;
      if (easy) {
        if (L.prevH === null) L.prevH = 520;

        h = clamp(L.prevH + (r() - 0.5) * 150, 420, 700);
        L.prevH = h;
        w = 220 + r() * 120;
        gap = 70 + r() * 50;
      } else {

        h = MIN_H + (MAX_H - MIN_H) * (1 - Math.pow(r(), 2));
        w = 200 + r() * 220;
        gap = 110 + r() * 145;
      }
      L.count++;
      L.items.push({ x: L.cursor, w: w, top: L.baseY - h, door: L.count % DOOR_AT === 0 });
      L.cursor += w + gap;
    }
  }
  var KEEP_BEHIND = 15;

  function trimLevel(L, minX) {
    var behind = 0;
    while (behind < L.items.length &&
           L.items[behind].x + L.items[behind].w < minX) behind++;
    for (var i = behind - KEEP_BEHIND; i > 0; i--) L.items.shift();
  }
  function nearIn(L, x0, x1) {
    var out = [], it = L.items;
    for (var i = 0; i < it.length; i++) {
      var b = it[i];
      if (b.x + b.w < x0) continue;
      if (b.x > x1) break;
      out.push(b);
    }
    return out;
  }

  function shiftDown() {
    levels = [levels[1], levels[2],
              makeLevel(levels[2].baseY + LEVEL_GAP, (Math.random() * 1e9) | 0, false)];
  }
  function shiftUp() {
    levels = [makeLevel(levels[0].baseY - LEVEL_GAP, (Math.random() * 1e9) | 0, false),
              levels[0], levels[1]];
  }

  var player, rope, cam, stats, keys = Object.create(null);
  var pointer = { down: false, x: 0, y: 0 };
  var drawX = 0, drawY = 0;
  var puffs = [];

  var hasRope = true;
  var loose = null;
  var PICKUP = 22;
  var PICKUP_DELAY = 2.5;
  var ANCHOR_REACH = 40;
  var GRAPPLE_GAP = 0.5;
  var BREAK_CHANCE = 0.45;
  var ropeUses = 0;
  var lastGrappleT = -99;
  var ropeSafe = false;
  var SWING_DAMP = 0.55;
  var SWING_MIN = 3 * Math.PI / 180;
  var SNAP_MAX_SPEED = 1000;
  var SNAP_MIN_CLEAR = 400;

  function streetBelow(y) {
    var best = null;
    for (var li = 0; li < levels.length; li++) {
      var L = levels[li];
      if (L.baseY >= y && (best === null || L.baseY < best)) best = L.baseY;
    }
    return best;
  }

  function clearanceBelow() {
    var p = player, best = null;
    for (var li = 0; li < levels.length; li++) {
      var L = levels[li];
      if (L.baseY >= p.y && (best === null || L.baseY < best)) best = L.baseY;
    }
    return best === null ? Infinity : best - p.y;
  }
  var lockGrapple = false;

  function buildWorld(intro, spawnDoor) {
    levels = [
      makeLevel(GROUND_Y - LEVEL_GAP, (Math.random() * 1e9) | 0, false),
      makeLevel(GROUND_Y, (Math.random() * 1e9) | 0, intro),
      makeLevel(GROUND_Y + LEVEL_GAP, (Math.random() * 1e9) | 0, false)
    ];
    var b0 = levels[1].items[0];
    for (var i = 0; i < levels[1].items.length; i++) {
      if (levels[1].items[i].x >= 0) { b0 = levels[1].items[i]; break; }
    }

    if (spawnDoor) b0.door = true;
    player = {
      x: b0.x + b0.w * 0.5, y: b0.top - RADIUS,
      rx: 0, ry: 0, vx: 0, vy: 0, grounded: true, jumps: 0, airCutDir: 0,
      rechargeT: 0, blinkT: 0
    };
    player.rx = player.x; player.ry = player.y;
  }

  function reset() {
    frozen = false;
    started = false;
    idleT = 0;
    introP = 1;
    tipIndex = 0;
    doorT = 0;
    doorLock = false;
    setTheme(darkSide);
    elTip.textContent = TIPS[0];
    elTitle.classList.remove("gone");
    buildWorld(true, false);
    rope = { on: false, x: 0, y: 0, len: 0 };
    puffs = [];
    hasRope = true;
    loose = null;
    ropeUses = 0;
    ropeSafe = false;
    lastGrappleT = -99;
    runT = 0;
    depthHist = [];
    lockGrapple = false;
    cam = { x: player.x, y: player.y - 60, zoom: 1, lead: 0, limitV: GROUND_Y + 120 };
    stats = { startX: player.x, far: 0, high: 0, low: 0 };
  }

  function tryGrapple() {
    if (!pointer.down || !hasRope) return false;
    var wp = screenToWorld(pointer.x, pointer.y);
    var dx = wp.x - player.x, dy = wp.y - player.y;
    var d = Math.hypot(dx, dy);
    if (d < 12) return false;
    var ux = dx / d, uy = dy / d;
    var ex = player.x + ux * MAX_ROPE;

    var stp = 6, n = Math.floor(MAX_ROPE / stp);
    var bx = 0, by = 0, bd = Infinity, found = false;

    for (var li = 0; li < levels.length; li++) {
      var L = levels[li];
      var list = nearIn(L, Math.min(player.x, ex) - 40, Math.max(player.x, ex) + 40);
      for (var i = 5; i <= n; i++) {
        var sx = player.x + ux * stp * i, sy = player.y + uy * stp * i;
        for (var j = 0; j < list.length; j++) {
          var b = list[j];
          if (sx > b.x && sx < b.x + b.w && sy > b.top && sy < L.baseY) {
            var dd = Math.hypot(sx - wp.x, sy - wp.y);
            if (dd < bd) { bd = dd; bx = sx; by = sy; found = true; }
            break;
          }
        }
      }
    }
    if (!found) return false;

    rope.on = true; rope.x = bx; rope.y = by;
    ropeUses++;

    var spam = (runT - lastGrappleT) < GRAPPLE_GAP;
    lastGrappleT = runT;

    player.jumps = Math.max(player.jumps, MAX_JUMPS - 1);
    rope.len = clamp(Math.hypot(player.x - bx, player.y - by), MIN_ROPE, MAX_ROPE);
    if (spam && breakAllowed() && Math.random() < BREAK_CHANCE) {
      snapRope();
      lockGrapple = true;
    }
    return true;
  }

  function breakAllowed() {
    if (ropeSafe) return false;
    return Math.hypot(player.vx, player.vy) <= SNAP_MAX_SPEED &&
           clearanceBelow() > SNAP_MIN_CLEAR;
  }

  function release() { rope.on = false; }

  function snapRope() {
    if (!rope.on) return;
    rope.on = false;

    var dx = player.x - rope.x, dy = player.y - rope.y;
    var L = Math.max(MIN_ROPE, Math.hypot(dx, dy) * 0.5);
    var th = Math.atan2(dx, dy);
    loose = {
      phase: "swing",
      ax: rope.x, ay: rope.y, len: L,
      th: th,

      av: (player.vx * Math.cos(th) - player.vy * Math.sin(th)) / L,

      free: false,
      age: 0,
      x: 0, y: 0, py: 0, vx: 0, vy: 0
    };
    hasRope = false;
  }

  function looseTip() {
    if (!loose) return null;
    if (loose.phase === "swing") {
      return { x: loose.ax + Math.sin(loose.th) * loose.len,
               y: loose.ay + Math.cos(loose.th) * loose.len };
    }
    return { x: loose.x, y: loose.y };
  }

  function surfaceCrossed(x, py, y) {
    var best = null;
    for (var li = 0; li < levels.length; li++) {
      var L = levels[li];
      var list = nearIn(L, x - 600, x + 600);
      for (var i = 0; i < list.length; i++) {
        var b = list[i];
        if (x > b.x && x < b.x + b.w && b.top >= py && b.top <= y &&
            (best === null || b.top < best)) best = b.top;
      }
      if (L.baseY >= py && L.baseY <= y && (best === null || L.baseY < best)) best = L.baseY;
    }
    return best;
  }

  function stepLoose(dt) {
    if (!loose) return;
    loose.age += dt;
    if (loose.phase === "swing") {

      loose.av += (-GRAV / loose.len) * Math.sin(loose.th) * dt;
      loose.av *= (1 - SWING_DAMP * dt);
      loose.th += loose.av * dt;

      var amp = Math.acos(clamp(
        Math.cos(loose.th) - loose.len * loose.av * loose.av / (2 * GRAV), -1, 1));
      if (amp < SWING_MIN) {
        var tip = looseTip();
        loose.phase = "fall";
        loose.x = tip.x; loose.y = tip.y; loose.py = tip.y; loose.vx = 0; loose.vy = 0;
      }
    } else if (loose.phase === "fall") {
      loose.py = loose.y;
      loose.vy += GRAV * dt;
      loose.y += loose.vy * dt;
      var top = surfaceCrossed(loose.x, loose.py, loose.y + 3);
      if (top === null) {

        var floorY = levels[0].baseY;
        for (var fi = 1; fi < levels.length; fi++) {
          if (levels[fi].baseY > floorY) floorY = levels[fi].baseY;
        }
        if (loose.y + 3 >= floorY) top = floorY;
      }
      if (top !== null) {
        loose.y = top - 3;
        loose.phase = "rest";
      }
    }

    if (loose.age < PICKUP_DELAY) return;
    var reach = RADIUS + PICKUP;

    if (loose.phase === "swing" && anchorReachable(loose.ax, loose.ay) &&
        Math.hypot(player.x - loose.ax, player.y - loose.ay) < reach) {
      loose = null;
      hasRope = true;
      return;
    }

    if (loose.phase === "rest") {
      var t = looseTip();
      var gap = Math.hypot(player.x - t.x, player.y - t.y);
      if (gap > reach * 1.5) loose.free = true;
      if (loose.free && gap < reach) {
        loose = null;
        hasRope = true;
        ropeSafe = true;
      }
    }
  }

  function anchorReachable(ax, ay) {
    for (var li = 0; li < levels.length; li++) {
      var L = levels[li];
      var list = nearIn(L, ax - 200, ax + 200);
      for (var i = 0; i < list.length; i++) {
        var b = list[i];
        if (ax >= b.x && ax <= b.x + b.w && Math.abs(ay - b.top) < ANCHOR_REACH) {
          return true;
        }
      }
      if (Math.abs(ay - L.baseY) < ANCHOR_REACH) return true;
    }
    return false;
  }

  function crossOver() {
    darkSide = !darkSide;
    themeAuto = false;
    setTheme(darkSide);
    doorT = 0;
    doorLock = true;
    var far = stats.far;
    buildWorld(false, true);
    stats.startX = player.x;
    stats.far = far;
    rope.on = false;
    puffs = [];
    hasRope = true;
    loose = null;
    lockGrapple = false;
    cam.x = player.x; cam.y = player.y - 60; cam.lead = 0; cam.limitV = player.y + 120;
  }

  function groundHop() {
    player.jumps = 1;
    player.vy = -JUMP;
    player.grounded = false;
  }
  var COYOTE = 7;
  var MAX_JUMPS = 2;
  var RECHARGE = 4;

  function surfaceBelow() {
    var p = player;
    if (p.vy < 0) return false;

    var braced = !!keys[" "];
    var fast = Math.hypot(p.vx, p.vy) > PHASE_SPEED;
    var roofOK, streetOK;
    if (rope.on) {
      roofOK = rope.len < SHORT_ROPE;
      streetOK = false;
    } else {
      roofOK = braced || !fast;
      streetOK = braced || !(p.jumps >= MAX_JUMPS && fast);
    }
    for (var li = 0; li < levels.length; li++) {
      var L = levels[li];
      if (roofOK) {
        var list = nearIn(L, p.x - 500, p.x + 500);
        for (var i = 0; i < list.length; i++) {
          var b = list[i];
          if (p.x + RADIUS > b.x && p.x - RADIUS < b.x + b.w) {
            var gap = b.top - (p.y + RADIUS);
            if (gap >= 0 && gap <= COYOTE) return true;
          }
        }
      }
      if (streetOK) {
        var g = L.baseY - (p.y + RADIUS);
        if (g >= 0 && g <= COYOTE) return true;
      }
    }
    return false;
  }

  function jumpPressed() {

    if (player.grounded || surfaceBelow()) { groundHop(); return; }
    if (player.jumps >= MAX_JUMPS) return;
    player.jumps++;
    player.rechargeT = 0;
    player.vy = -JUMP;
    player.grounded = false;

    if (player.jumps >= MAX_JUMPS) {
      puffs.push({ x: player.x, y: player.y, t: 0, life: 0.38 });
    }
  }

  function step(dt) {
    var p = player;
    p.rx = p.x; p.ry = p.y;

    runT += dt;
    var depthNow = Math.round((GROUND_Y - levels[1].baseY) / LEVEL_GAP);
    if (!depthHist.length || depthHist[depthHist.length - 1].d !== depthNow) {
      depthHist.push({ d: depthNow, t: runT });
    }
    while (depthHist.length > 1 && runT - depthHist[0].t > BACKROOMS_WINDOW) {
      depthHist.shift();
    }
    for (var hi = 0; hi < depthHist.length; hi++) {
      if (depthHist[hi].d - depthNow >= BACKROOMS_DROP) { frozen = true; return; }
    }

    if (pointer.down && !rope.on && !lockGrapple) tryGrapple();

    if (keys[" "] && p.grounded) groundHop();

    if (rope.on) {
      if (keys.w || keys.arrowup) {
        rope.len = Math.max(MIN_ROPE, rope.len - 520 * dt);
        var rdx = rope.x - p.x, rdy = rope.y - p.y, rd = Math.hypot(rdx, rdy) || 1;
        p.vx += (rdx / rd) * 640 * dt;
        p.vy += (rdy / rd) * 640 * dt;
      } else if (keys.s || keys.arrowdown) {

        var floorY = streetBelow(rope.y);
        var cap = floorY === null ? MAX_ROPE
                                  : Math.min(MAX_ROPE, floorY - RADIUS - rope.y);
        var want = rope.len + 460 * dt;
        if (want <= cap) rope.len = want;
      } else {
        var f = clamp(p.vy / 260, -1, 1);
        rope.len = clamp(rope.len + (f > 0 ? -95 * f : 70 * -f) * dt, MIN_ROPE, MAX_ROPE);
      }
    }

    var left = !!(keys.a || keys.arrowleft);
    var right = !!(keys.d || keys.arrowright);
    var accel = (right ? 1 : 0) - (left ? 1 : 0);
    var brake = left && right;

    if (brake) {

      p.vx = 0;
      p.airCutDir = 0;
    } else if (p.grounded) {
      if (accel) {
        var along = accel * p.vx;
        if (along < 0) {

          p.vx = accel * Math.min(Math.abs(p.vx), RUN_MAX);
        } else if (along < RUN_MAX) {

          var t = clamp(along / RUN_MAX, 0, 1);
          var a = Math.max(RUN_ACCEL_MIN, RUN_ACCEL_MAX * (1 - t));
          p.vx += accel * a * dt;
        }
      } else {
        p.vx *= (1 - 4.5 * dt);
      }
      p.airCutDir = 0;
    } else {

      if (!rope.on && accel && (accel * p.vx < 0 || p.airCutDir === accel)) {
        p.vx = 0;
        p.airCutDir = accel;
      } else {
        p.airCutDir = 0;
        p.vx += accel * (rope.on ? 620 : 430) * dt;
        p.vx *= (1 - 0.06 * dt);
        if (rope.on) {
          var sp0 = Math.hypot(p.vx, p.vy);
          if (sp0 > 1) p.vx += (p.vx / sp0) * 130 * dt;
        }
      }
    }

    p.vy += GRAV * dt;
    var py0 = p.y;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.grounded = false;

    if (rope.on) {
      var dx = p.x - rope.x, dy = p.y - rope.y;
      var d = Math.hypot(dx, dy);
      if (d > rope.len && d > 0.001) {
        var nx = dx / d, ny = dy / d;
        p.x = rope.x + nx * rope.len;
        p.y = rope.y + ny * rope.len;
        var radial = p.vx * nx + p.vy * ny;
        if (radial > 0) { p.vx -= nx * radial; p.vy -= ny * radial; }
      }

    }

    var landedOn = -1;
    var onDoor = false;
    var braced = !!keys[" "];
    var recovering = loose !== null && !rope.on;
    var fast = Math.hypot(p.vx, p.vy) > PHASE_SPEED;
    var hollow = p.jumps >= MAX_JUMPS;
    var roofSolid, streetSolid;
    if (rope.on) { roofSolid = rope.len < SHORT_ROPE; streetSolid = false; }
    else if (braced || recovering) { roofSolid = true; streetSolid = true; }
    else { roofSolid = !fast; streetSolid = !(hollow && fast); }

    if (p.vy > 0 && (roofSolid || streetSolid)) {
      for (var li = 0; li < levels.length && landedOn < 0; li++) {
        var L = levels[li];
        if (roofSolid) {
          var list = nearIn(L, p.x - 500, p.x + 500);
          for (var i = 0; i < list.length; i++) {
            var b = list[i];
            if (p.x + RADIUS > b.x && p.x - RADIUS < b.x + b.w &&
                py0 + RADIUS <= b.top + 1 && p.y + RADIUS >= b.top) {
              p.y = b.top - RADIUS; p.vy = 0; p.grounded = true; p.jumps = 0;
              landedOn = li;
              if (b.door && Math.abs(p.x - (b.x + b.w / 2)) < 24) onDoor = true;
              break;
            }
          }
        }
        if (landedOn < 0 && streetSolid &&
            py0 + RADIUS <= L.baseY + 1 && p.y + RADIUS >= L.baseY) {
          p.y = L.baseY - RADIUS; p.vy = 0; p.grounded = true; p.jumps = 0;
          landedOn = li;
        }
      }
    }

    if (landedOn === 2) shiftDown();
    else if (landedOn === 0) shiftUp();

    else if (p.y > levels[2].baseY + 200) shiftDown();
    else if (p.y < levels[0].baseY - MAX_H - 600) shiftUp();

    if (onDoor) {
      if (!doorLock) {
        doorT += dt;
        if (doorT >= DOOR_HOLD) { crossOver(); return; }
      }
    } else {
      doorT = 0;
      doorLock = false;
    }

    if (p.jumps >= MAX_JUMPS) {
      p.rechargeT += dt;
      if (p.rechargeT >= RECHARGE) { p.jumps = MAX_JUMPS - 1; p.rechargeT = 0; p.blinkT = 0.7; }
    }
    if (p.blinkT > 0) p.blinkT -= dt;

    stats.far = Math.max(stats.far, (p.x - stats.startX) / PPM);
    stepLoose(dt);
    var altNow = (GROUND_Y - p.y) / PPM;
    if (altNow > stats.high) stats.high = altNow;
    if (altNow < stats.low) stats.low = altNow;
  }

  function updateCamera(dt) {

    var target = started ? 0 : 1;
    var rate = dt / INTRO_TIME;
    if (introP < target) introP = Math.min(target, introP + rate);
    else if (introP > target) introP = Math.max(target, introP - rate);
    var s = introP * introP * (3 - 2 * introP);
    cam.zoom = clamp(Math.min(W / 1400, H / 820), 0.4, 1.1) * (1 + (INTRO_ZOOM - 1) * s);
    cam.lead = lerp(cam.lead, player.vx, 1 - Math.pow(0.02, dt));
    var tx = drawX + cam.lead * 0.2;

    var base = levels[1].baseY;
    var rawLimit = (rope.on || drawY > base - 60) ? base + LEVEL_GAP : base + 120;
    cam.limitV = lerp(cam.limitV, rawLimit, 1 - Math.pow(0.05, dt));
    var ty = Math.min(drawY - 40, cam.limitV - (H / 2) / cam.zoom);

    cam.x = lerp(cam.x, tx, 1 - Math.pow(0.0015, dt));
    cam.y = lerp(cam.y, ty, 1 - Math.pow(0.004, dt));
  }
  function screenToWorld(sx, sy) {
    return { x: (sx - W / 2) / cam.zoom + cam.x, y: (sy - H / 2) / cam.zoom + cam.y };
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);

    var halfW = (W / 2) / cam.zoom;
    var left = cam.x - halfW - 200, right = cam.x + halfW + 200;

    for (var li = 0; li < levels.length; li++) {
      var L = levels[li];
      growLevel(L, right + 900);
      trimLevel(L, left - 1400);

      ctx.lineWidth = 2;
      for (var i = 0; i < L.items.length; i++) {
        var b = L.items[i];
        if (b.x + b.w < left || b.x > right) continue;
        ctx.fillStyle = theme.fill;
        ctx.fillRect(b.x, b.top, b.w, L.baseY - b.top);
        ctx.strokeStyle = theme.edge;
        ctx.strokeRect(b.x, b.top, b.w, L.baseY - b.top);

        if (b.door) {
          var dx0 = b.x + b.w / 2 - 17;
          ctx.fillStyle = theme.bg;
          ctx.fillRect(dx0, b.top - 46, 34, 46);
          ctx.strokeStyle = theme.ink;
          ctx.lineWidth = 2;
          ctx.strokeRect(dx0, b.top - 46, 34, 46);
          ctx.fillStyle = theme.ink;
          ctx.fillRect(dx0 + 26, b.top - 25, 4, 4);
          ctx.lineWidth = 2;
        }
      }

      ctx.strokeStyle = theme.ink;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(left - 200, L.baseY);
      ctx.lineTo(right + 200, L.baseY);
      ctx.stroke();
    }

    if (rope.on) {
      ctx.strokeStyle = theme.rope;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(drawX, drawY);
      ctx.lineTo(rope.x, rope.y);
      ctx.stroke();
      ctx.fillStyle = theme.rope;
      ctx.fillRect(rope.x - 3, rope.y - 3, 6, 6);
    }

    if (loose) {
      var lt = looseTip();
      ctx.strokeStyle = theme.rope;
      ctx.fillStyle = theme.rope;
      if (loose.phase === "swing") {
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(loose.ax, loose.ay);
        ctx.lineTo(lt.x, lt.y);
        ctx.stroke();
        ctx.fillRect(loose.ax - 3, loose.ay - 3, 6, 6);
      } else {

        ctx.fillRect(lt.x - 3, lt.y - 3, 6, 6);
      }
    }

    for (var pi = 0; pi < puffs.length; pi++) {
      var q = puffs[pi];
      var k = q.t / q.life;
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = theme.ink;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(q.x, q.y, RADIUS + k * 30, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    var full = player.jumps < MAX_JUMPS;
    if (player.blinkT > 0) full = Math.floor(player.blinkT * 12) % 2 === 0;

    ctx.fillStyle = full ? theme.dot : theme.bg;
    ctx.beginPath();
    ctx.arc(drawX, drawY, RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = full ? theme.dotEdge : theme.dot;
    ctx.lineWidth = 2;
    ctx.stroke();

    if (loose) {
      var tgt = loose.phase === "swing"
        ? { x: loose.ax, y: loose.ay }
        : looseTip();
      var adx = tgt.x - drawX, ady2 = tgt.y - drawY;
      var adist = Math.hypot(adx, ady2);
      if (adist > 30) {
        var ux = adx / adist, uy = ady2 / adist;
        var px2 = -uy, py2 = ux;
        var bx2 = drawX + ux * 18, by2 = drawY + uy * 18;
        ctx.fillStyle = theme.rope;
        ctx.beginPath();
        ctx.moveTo(bx2 + ux * 5, by2 + uy * 5);
        ctx.lineTo(bx2 - ux * 2 + px2 * 3.2, by2 - uy * 2 + py2 * 3.2);
        ctx.lineTo(bx2 - ux * 0.7, by2 - uy * 0.7);
        ctx.lineTo(bx2 - ux * 2 - px2 * 3.2, by2 - uy * 2 - py2 * 3.2);
        ctx.closePath();
        ctx.fill();
      }
    }

    ctx.restore();
  }

  var STATS = [
    { k: "dist",   get: function () { return Math.round(player.x - stats.startX) + "px"; } },
    { k: "speed",  get: function () { return Math.round(Math.hypot(player.vx, player.vy)) + "px/s"; } },
    { k: "height", get: function () { return Math.round(GROUND_Y - player.y) + "px"; } },
    { k: "depth",  get: function () { return String(Math.round((GROUND_Y - levels[1].baseY) / LEVEL_GAP)); } }
  ];
  var pinned = null;
  var statEls = [];

  function buildHud() {
    elHud.textContent = "";
    STATS.forEach(function (s, i) {
      if (i) elHud.appendChild(document.createTextNode(", "));
      var el = document.createElement("span");
      el.className = "stat";
      el.addEventListener("click", function () {
        pinned = pinned === s.k ? null : s.k;
        statEls.forEach(function (e, j) {
          e.classList.toggle("pinned", STATS[j].k === pinned);
        });
        elBig.hidden = !pinned;
        elBigK.textContent = pinned || "";
      });
      elHud.appendChild(el);
      statEls.push(el);
    });
  }

  function hud() {
    for (var i = 0; i < STATS.length; i++) {
      var v = STATS[i].get();
      statEls[i].textContent = STATS[i].k + " " + v;
      if (pinned === STATS[i].k) elBigV.textContent = v;
    }
  }

  var last = performance.now(), acc = 0, FIXED = 1 / 180;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (frozen) {
      acc = 0;
      drawX = player.x; drawY = player.y;
    } else {
      acc += dt;
      var guard = 0;
      while (acc >= FIXED && guard < 20 && !frozen) { step(FIXED); acc -= FIXED; guard++; }
      if (guard >= 20) acc = 0;
      var a = clamp(acc / FIXED, 0, 1);
      drawX = lerp(player.rx, player.x, a);
      drawY = lerp(player.ry, player.y, a);

      if (started && hasRope) {
        var holding = pointer.down || keys[" "] || keys.a || keys.d || keys.w || keys.s ||
                      keys.arrowleft || keys.arrowright || keys.arrowup || keys.arrowdown;
        if (holding || Math.hypot(player.vx, player.vy) > 12) idleT = 0;
        else {
          idleT += dt;
          if (idleT >= IDLE_BACK) returnToIntro();
        }
      } else {
        idleT = 0;
      }

      updateCamera(dt);
    }

    elAch.hidden = !frozen;

    for (var i = puffs.length - 1; i >= 0; i--) {
      puffs[i].t += dt;
      if (puffs[i].t >= puffs[i].life) puffs.splice(i, 1);
    }

    render();
    hud();
    requestAnimationFrame(frame);
  }

  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === " " || k.indexOf("arrow") === 0) e.preventDefault();
    if (e.repeat) return;
    keys[k] = true;
    if (k === "r") { reset(); return; }
    beginPlay();
    if (k === " ") jumpPressed();
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
  window.addEventListener("blur", function () { pointer.down = false; keys = Object.create(null); });

  cv.addEventListener("pointerdown", function (e) {
    cv.setPointerCapture(e.pointerId);
    pointer.down = true; pointer.x = e.clientX; pointer.y = e.clientY;
    lockGrapple = false;
    beginPlay();
    tryGrapple();
  });
  cv.addEventListener("pointermove", function (e) { pointer.x = e.clientX; pointer.y = e.clientY; });
  function up() { pointer.down = false; lockGrapple = false; release(); }
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", up);

  resize();
  darkSide = darkReaderActive() || prefersDark();
  reset();
  buildHud();

  setTimeout(detectDark, 400);
  setTimeout(detectDark, 1500);
  try {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", detectDark);
  } catch (e) {}
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
